<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/favicon.png">
</head>
<body>
  <header>
    <h1>Task Tracker</h1>
  </header>
  <main>
    <div class="app__container">
      <h3 class="app__title">Do what you love...</h3>
      <div class="input__container">
        <input
          class="input"
          id="input"
          type="text"
          placeholder="Add a task..."
          autocomplete="off"
        >
        <button class="btn_add" id="btn_add">Add</button>
      </div>
      <div class="list__container">
        <div class="btn-filters__container">
          <button class="btn__filter" data-filter="all">All</button>
          <button class="btn__filter" data-filter="active">Active</button>
          <button class="btn__filter" data-filter="done">Done</button>
        </div>
        <div id="tasks__list"></div>
      </div>
    </div>
  </main>
  <footer></footer>
  <script src="index.js"></script>
</body>
</html>
